<table class="employee-table">
  <thead>
    <tr>
      <th>Name</th>
      <th>Email</th>
      <th>Department</th>
      <th>Phone Number</th>
      <th class="actions-col">Actions</th>
    </tr>
  </thead>
  <tbody>
    @for (emp of employees; track emp.id) {
      <app-employeerow
        [employee]="emp"
        (delete)="delete.emit(emp)"
      ></app-employeerow>
    }
  </tbody>
</table>
