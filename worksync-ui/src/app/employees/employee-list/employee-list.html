
  <h1>Workforce & Task Management System</h1>

  <div class="card">
    <h2>Add Employee</h2>

    <div class="form-row">
      <input type="text" placeholder="Name" [(ngModel)]="name">
      <input type="email" placeholder="Email" [(ngModel)]="email">
      <input type="text" placeholder="Phone Number" [(ngModel)]="phoneNumber">
      <select [(ngModel)]="department">
  <option value="" disabled selected>Select Department</option>
  <option value="Finance">Finance</option>
  <option value="HR">HR</option>
  <option value="Marketing">Marketing</option>
  <option value="Engineering">Engineering</option>
  <option value="Sales">Sales</option>
</select>
    </div>

    <button type="button" class="add-btn" (click)="addEmployee()">
      {{ isEditMode ? 'Update Employee' : 'Add Employee' }}
    </button>
    

</div>
  

  <div class="card">
    <h3>Search Employee</h3>
    <input
      class="search-box"
      type="text"
      placeholder="Search by Name"
      [(ngModel)]="searchText">
  </div>

  <div class="card">
    <h2>Employee List</h2>

    <table>
      <thead>
        <tr>
          <th>Id</th>
          <th>Name</th>
          <th>Email</th>
          <th>Phone Number</th>
          <th>Department</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let employee of filteredEmployees">
          <td>{{ employee.id }}</td>
          <td>{{ employee.name }}</td>
          <td>{{ employee.email }}</td>
          <td>{{ employee.phone }}</td>
<td>{{ employee.department?.name }}</td>
          <td>
            <button type="button" class="edit-btn" (click)="editEmployee(employee)">
              Edit
            </button>

            <button type="button" class="delete-btn" (click)="deleteEmployee(employee.id)">
              Delete
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
