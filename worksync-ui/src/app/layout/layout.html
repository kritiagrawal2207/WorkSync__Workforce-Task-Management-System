<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-logo">WS</div>
      <span class="brand-name">{{ strings.brand }}</span>
    </div>
    <nav class="sidebar-nav">
      <a routerLink="/dashboard" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">📊</span>{{ strings.dashboard }}
      </a>
      @if (role === 'Admin' || role === 'Manager') {
        <a routerLink="/employees" routerLinkActive="active" class="nav-item">
          <span class="nav-icon">👥</span>{{ strings.employees }}
        </a>
      }
      <a routerLink="/attendance" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">🕐</span>{{ strings.attendance }}
      </a>
      <a routerLink="/tasks" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">✅</span>{{ strings.tasks }}
      </a>
      @if (role === 'Admin') {
        <a routerLink="/admin" routerLinkActive="active" class="nav-item">
          <span class="nav-icon">⚙️</span>{{ strings.admin }}
        </a>
      }
    </nav>
    <div class="sidebar-footer">
      <button class="logout-btn" (click)="logout()">
        <span>🚪</span> {{ strings.logout }}
      </button>
    </div>
  </aside>
  <div class="main-area">
    <header class="topbar">
      <div class="topbar-left"></div>
      <div class="topbar-right">
        <span class="user-name">Welcome, {{ user?.name }}</span>
      </div>
    </header>
    <main class="page-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
