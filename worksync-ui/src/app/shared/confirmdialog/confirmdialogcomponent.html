<div class="overlay" (click)="onCancel()">
  <div class="modal" (click)="$event.stopPropagation()">
    <div class="icon-circle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="3 6 5 6 21 6" />
        <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
        <path d="M10 11v6" />
        <path d="M14 11v6" />
        <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" />
      </svg>
    </div>
    <h2>{{ constants.DELETE_EMPLOYEE_TITLE }}</h2>
    <p>{{ constants.DELETE_EMPLOYEE_MESSAGE_PREFIX }} <strong>{{ employeeName }}</strong>? {{ constants.DELETE_EMPLOYEE_MESSAGE_SUFFIX }}</p>
    <div class="actions">
      <button class="btn btn-secondary" (click)="onCancel()">{{ constants.CANCEL_BUTTON }}</button>
      <button class="btn btn-danger" (click)="onConfirm()">{{ constants.DELETE_BUTTON }}</button>
    </div>
  </div>
</div>
